<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waves — charity: water</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="brand-bar">
    <span class="jerry-can">🟡</span>
    <span class="brand-text">charity: water presents</span>
  </header>

  <main class="game-container">
    <h1 class="game-title">WAVES</h1>

    <section class="battle-scene">
      <div class="top-row">
        <h2 id="enemyName">E. Coli the Ogre</h2>
        <div class="timer">⏱ <span id="timerDisplay">60</span>s</div>
      </div>

      <div class="arena">
        <div class="combatant enemy-side">
          <div class="hp-block">
            <label for="enemyHPBar">Enemy HP</label>
            <progress id="enemyHPBar" max="100" value="100"></progress>
          </div>
          <div class="sprite-stage">
            <span id="enemySprite" class="sprite enemy-sprite">🧌</span>
            <span id="enemyDamagePop" class="damage-pop hidden"></span>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="combatant player-side">
          <div class="sprite-stage">
            <span id="playerSprite" class="sprite player-sprite">🧍</span>
            <span id="playerDamagePop" class="damage-pop hidden"></span>
          </div>
          <div class="hp-block">
            <label for="playerHPBar">Your HP</label>
            <progress id="playerHPBar" max="100" value="100"></progress>
          </div>
        </div>
      </div>

      <p id="feedbackText" class="feedback"></p>

      <div class="moves">
        <button class="move-btn" data-move="filter">Filter</button>
        <button class="move-btn" data-move="disinfect">Disinfect</button>
        <button class="move-btn" data-move="boil">Boil</button>
      </div>

      <div class="status-row">
        <span class="coins">💧 <span id="scoreDisplay">0</span> coins</span>
        <button id="resetBtn">Reset</button>
      </div>
    </section>

    <div id="winBanner" class="banner hidden">
      <p>Well Unlocked! 🎉</p>
    </div>
  </main>

  <div id="confettiContainer" class="confetti-container"></div>

  <script src="script.js"></script>
</body>
</html>
